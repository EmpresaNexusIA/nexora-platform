name: nexora-redis

services:
  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta_REDIS_PASSWORD_en_.env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?falta_REDIS_PASSWORD_en_.env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 128m
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexora_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
    name: nexora_redis_data

networks:
  nexora_net:
    external: true
