name: nexora-qdrant

services:
  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: nexora-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?falta_QDRANT_API_KEY_en_.env}
    mem_limit: 512m
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexora_net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    name: nexora_qdrant_data

networks:
  nexora_net:
    external: true
